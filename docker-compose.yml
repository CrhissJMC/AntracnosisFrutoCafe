# Proyecto Antracnosis — levanta todo con:  docker compose up -d --build
name: antracnosis

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antracnosis}
      POSTGRES_USER: ${POSTGRES_USER:-antracnosis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Solo accesible desde tu PC (para pgAdmin/DBeaver), no desde la red
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-antracnosis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-antracnosis}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en el archivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
      # 1 = solo nginx; 2 = nginx + túnel de Cloudflare
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # Túnel público temporal (Cloudflare Quick Tunnel, sin cuenta).
  # Solo arranca con:  docker compose --profile tunnel up -d
  # La URL pública aparece en:  docker compose logs tunnel
  tunnel:
    image: cloudflare/cloudflared:2025.8.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:80
    profiles: ["tunnel"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
